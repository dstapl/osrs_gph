title: osrs_gph.rs back-end settings file.

api:
  url: https://prices.runescape.wiki/api/v1/osrs
  timespan: latest
  auth_headers:
    User-Agent: profit_margins - @blamblamdan

filepaths:
  price_data: api_data/price_data.json

  lookup_data:
    id_to_name: lookup_data/id_to_name.yaml
    name_to_id: lookup_data/name_to_id.yaml
    api_mapping: lookup_data/mapping.yaml

    recipes: lookup_data/recipes.yaml

  results:
    optimal: results/optimal_overview.md
    lookup: results/recipe_lookup.md

  main_log_file: runtime.log
  # TODO: Currently this is shared across all bin/* in the project
  bin_log_file: src/bin/generators.log

profit:
  # Underscores are removed from strings
  coins: 2_800_000
  percent_margin: 1.5 # buy +%, sell -% -> overall diff 2*%

  custom_weights: # Only if `custom` is selected in display.sort_by
    # TODO: Rename to profit?
    margin: 1.e-2
    time: -2.0
    gph: 1.e-5

  # Recipes will be ignored if any required items are listed here
  # (Items that have hit the buy limit or are just unwanted)
  ignore_items:
    - Chocolate bar
    - Weapon poison*
  
  # Ignore specific methods by their name instead of items involved
  ignore_methods:
    # - Gargoyles (Off-task)
    # - Killing Urium Shades

display:
  # File output (Frontend)
  # Number of entries to display in optimal_overview (0 == all)
  number: 0 # For optimal_overview.md

  #   `3h`, `4 hours`, `50 min` etc.
  #   `null` or empty for disabled
  #   Auto-caps at 6 hours
  time_limit: 3 hours

  lookup: # For recipe_lookup.md
    # Number of entries from optimal_overview to lookup in recipe_lookup
    # (0 == None / Disabled)
    top: 3

    # Filtering
    max_wildcard_matches: 3

    # Specific entries which might not be in the top bracket
    specific:
      - Humidify Clay
      - Casting * Leather *
    #   - Smithing Mithril cannonballs

  # name, profit, time, gph, custom
  sort_by: profit

  # Filtering results (Backend)
  filters:
    must_profit: true
    # show_hidden: true
    reverse: false

  # Only show results from: f2p, p2p, both
  membership: p2p
  

levels:
  # Put all player character levels here
  options:
    strict_recommended: true
  levels:
    combat level: 105
    quest points: 273
    attack: 89
    defence: 86
    strength: 82
    hitpoints: 87
    ranged: 76
    prayer: 70
    magic: 82
    cooking: 70
    woodcutting: 71
    fletching: 60
    fishing: 63
    firemaking: 83
    crafting: 83
    smithing: 76
    mining: 75
    herblore: 72
    agility: 74
    thieving: 78
    slayer: 78
    farming: 70
    runecraft: 59
    hunter: 71
    construction: 76
    sailing: 38
